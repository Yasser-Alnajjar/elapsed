name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Only for the tenant-isolation suite (apps/web/test/tenant-isolation.test.ts),
      # which needs real Prisma query semantics. Every other test uses fakes.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Build-time only — nothing here sends real mail. The only database
      # connection is the tenant-isolation suite's, via TEST_DATABASE_URL;
      # DATABASE_URL stays a placeholder that nothing connects to.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      TEST_DATABASE_URL: "postgresql://ci:ci@localhost:5432/sla_test?schema=public"
      NEXTAUTH_SECRET: "ci-nextauth-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      INTEGRATION_CONFIG_ENCRYPTION_KEY: "ci-integration-config-encryption-key"
      SMTP_ENCRYPTION_KEY: "ci-smtp-encryption-key"
      DEPLOYMENT_SMTP_HOST: "ci-smtp-host"
      DEPLOYMENT_SMTP_USER: "ci-smtp-user"
      DEPLOYMENT_SMTP_PASSWORD: "ci-smtp-password"
      DEPLOYMENT_SMTP_FROM: "ci-smtp-from"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sla/db generate

      - name: Type-check
        run: pnpm type-check

      - name: Migrate test database
        run: pnpm test:db:prepare

      - name: Test
        run: pnpm test

      # Roadmap 7.10: the 7 golden scenarios already run as part of `pnpm
      # test` above (TEST_DATABASE_URL is set for this whole job, so
      # `describe.skipIf(!TEST_DATABASE_URL)` never skips them here) — this
      # step re-runs just those two files by name so a failure is
      # unambiguous in the CI log, and so an accidental change that makes
      # them skippable in CI (e.g. TEST_DATABASE_URL going missing from this
      # job) fails loud here instead of silently passing an empty suite.
      - name: Golden SLA scenarios (required)
        run: npx vitest run apps/web/test/sla-golden-scenarios.test.ts apps/web/test/sla-e2e-matrix.test.ts

      - name: Build packages
        run: pnpm build

      - name: Build web app
        run: pnpm web:build

      - name: Build worker app
        run: pnpm worker:build
