server {
    listen 80;
    listen [::]:80;

    server_name 13.62.74.24;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name 13.62.74.24;

    ssl_certificate /etc/nginx/ssl/elapsed.crt;
    ssl_certificate_key /etc/nginx/ssl/elapsed.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # The live-data SSE stream (/api/live): a long-lived response nginx must
    # relay byte-for-byte as it arrives, not hold in its proxy buffer until
    # full or closed. Its own heartbeat comments keep this well under the
    # read timeout, but it's raised anyway so a slow event still doesn't trip
    # it on an otherwise-idle connection.
    location /api/live {
        proxy_pass http://web:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}