# Self-host/VPS production stack: Postgres, a one-shot `migrate` service,
# and the two application containers built from apps/web/Dockerfile and
# apps/worker/Dockerfile. See docs/deployment.md for the full walkthrough.
#
# Startup order (roadmap 7.1): postgres becomes healthy -> migrate runs
# `prisma migrate deploy` and exits 0 -> web and worker start independently.
# `docker compose up` blocks web/worker on both conditions, so a fresh
# deployment can never boot against an unmigrated schema.
name: Elapsed
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sla_breach_monitoring}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sla} -d ${POSTGRES_DB:-sla_breach_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    container_name: web
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      INTEGRATION_CONFIG_ENCRYPTION_KEY: ${INTEGRATION_CONFIG_ENCRYPTION_KEY:?INTEGRATION_CONFIG_ENCRYPTION_KEY is required}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY is required}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:?INTEGRATION_TOKEN_ENCRYPTION_KEY is required}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Deployment-owned SMTP for invitations, password resets and email
      # verification (roadmap D8) — optional at the container level, but
      # those flows fail explicitly at send time if left unset. Also used by
      # the worker's ops alert below (OPS_ALERT_EMAIL) — one shared
      # deployment-level mailer, not a separate credential set per feature.
      DEPLOYMENT_SMTP_HOST: ${DEPLOYMENT_SMTP_HOST:-}
      DEPLOYMENT_SMTP_PORT: ${DEPLOYMENT_SMTP_PORT:-587}
      DEPLOYMENT_SMTP_SECURITY: ${DEPLOYMENT_SMTP_SECURITY:-starttls}
      DEPLOYMENT_SMTP_USER: ${DEPLOYMENT_SMTP_USER:-}
      DEPLOYMENT_SMTP_PASSWORD: ${DEPLOYMENT_SMTP_PASSWORD:-}
      DEPLOYMENT_SMTP_FROM: ${DEPLOYMENT_SMTP_FROM:-}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    container_name: worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published to the host: nothing outside this container needs to
    # reach the liveness endpoint directly, only the Dockerfile's own
    # HEALTHCHECK (curl/wget over localhost inside the container). Add a
    # `ports:` mapping here yourself if an external uptime monitor should
    # poll it directly.
    expose:
      - "${WORKER_HEALTH_PORT:-8081}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      INTEGRATION_CONFIG_ENCRYPTION_KEY: ${INTEGRATION_CONFIG_ENCRYPTION_KEY:?INTEGRATION_CONFIG_ENCRYPTION_KEY is required}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY is required}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:?INTEGRATION_TOKEN_ENCRYPTION_KEY is required}
      WORKER_ACTIVE_POLL_MS: ${WORKER_ACTIVE_POLL_MS:-300000}
      WORKER_RECONCILIATION_MS: ${WORKER_RECONCILIATION_MS:-3600000}
      # All optional (roadmap step 29) — see .env.example's "Observability"
      # section and docs/deployment.md's "Health checks and observability".
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8081}
      # Single-instance advisory lock (roadmap step 42). See docs/deployment.md.
      WORKER_LOCK_RETRY_MS: ${WORKER_LOCK_RETRY_MS:-15000}
      WORKER_LOCK_PING_MS: ${WORKER_LOCK_PING_MS:-30000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPS_ALERT_SLACK_WEBHOOK_URL: ${OPS_ALERT_SLACK_WEBHOOK_URL:-}
      # The email channel's recipient — sent through the shared
      # DEPLOYMENT_SMTP_* config above (the web service's block), not its
      # own SMTP credentials. Stays off if DEPLOYMENT_SMTP_* is unset.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      DEPLOYMENT_SMTP_HOST: ${DEPLOYMENT_SMTP_HOST:-}
      DEPLOYMENT_SMTP_PORT: ${DEPLOYMENT_SMTP_PORT:-587}
      DEPLOYMENT_SMTP_SECURITY: ${DEPLOYMENT_SMTP_SECURITY:-starttls}
      DEPLOYMENT_SMTP_USER: ${DEPLOYMENT_SMTP_USER:-}
      DEPLOYMENT_SMTP_PASSWORD: ${DEPLOYMENT_SMTP_PASSWORD:-}
      DEPLOYMENT_SMTP_FROM: ${DEPLOYMENT_SMTP_FROM:-}
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/elapsed/ssl:/etc/nginx/ssl:ro
volumes:
  postgres-data:
