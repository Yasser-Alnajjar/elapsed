# Self-host/VPS production stack: Postgres, a one-shot `migrate` service,
# and the two application containers built from apps/web/Dockerfile and
# apps/worker/Dockerfile. See docs/deployment.md for the full walkthrough.
#
# Startup order (roadmap 7.1): postgres becomes healthy -> migrate runs
# `prisma migrate deploy` and exits 0 -> web and worker start independently.
# `docker compose up` blocks web/worker on both conditions, so a fresh
# deployment can never boot against an unmigrated schema.
name: Elapsed
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sla_breach_monitoring}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sla} -d ${POSTGRES_DB:-sla_breach_monitoring}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Optional source-map upload at build time (roadmap 7.6); all blank
      # means no upload. See docs/deployment.md.
      args:
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_URL: ${SENTRY_URL:-}
    restart: unless-stopped
    container_name: web
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # Custom REST support-assisted guard override (plan 09 6.11, U6): a separate
      # allowlist, read only by the web service. Empty means nobody (the safe default).
      GUARD_OVERRIDE_OPERATOR_EMAILS: ${GUARD_OVERRIDE_OPERATOR_EMAILS:-}
      INTEGRATION_CONFIG_ENCRYPTION_KEY: ${INTEGRATION_CONFIG_ENCRYPTION_KEY:?INTEGRATION_CONFIG_ENCRYPTION_KEY is required}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY is required}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:?INTEGRATION_TOKEN_ENCRYPTION_KEY is required}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Deployment-owned SMTP for invitations, password resets and email
      # verification (roadmap D8) — optional at the container level, but
      # those flows fail explicitly at send time if left unset. Also used by
      # the worker's ops alert below (OPS_ALERT_EMAIL) — one shared
      # deployment-level mailer, not a separate credential set per feature.
      DEPLOYMENT_SMTP_HOST: ${DEPLOYMENT_SMTP_HOST:-}
      DEPLOYMENT_SMTP_PORT: ${DEPLOYMENT_SMTP_PORT:-587}
      DEPLOYMENT_SMTP_SECURITY: ${DEPLOYMENT_SMTP_SECURITY:-starttls}
      DEPLOYMENT_SMTP_USER: ${DEPLOYMENT_SMTP_USER:-}
      DEPLOYMENT_SMTP_PASSWORD: ${DEPLOYMENT_SMTP_PASSWORD:-}
      DEPLOYMENT_SMTP_FROM: ${DEPLOYMENT_SMTP_FROM:-}

  # Any number of identical worker containers can run side by side; they split
  # the organizations between them through per-organization leases in
  # Postgres (docs/deployment.md, "Running multiple workers"). Scale with
  #   WORKER_REPLICAS=3 docker compose up -d
  # (or `docker compose up -d --scale worker=3`). No `container_name` and no
  # host port: both would make a second replica fail to start.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    # A stopping worker drains its in-flight organizations for up to
    # WORKER_SHUTDOWN_GRACE_MS (default 30s) before releasing their leases;
    # Docker's default 10s would SIGKILL it mid-drain.
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published to the host: nothing outside this container needs to
    # reach the liveness endpoint directly, only the Dockerfile's own
    # HEALTHCHECK (curl/wget over localhost inside the container). Add a
    # `ports:` mapping here yourself if an external uptime monitor should
    # poll it directly.
    expose:
      - "${WORKER_HEALTH_PORT:-8081}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      INTEGRATION_CONFIG_ENCRYPTION_KEY: ${INTEGRATION_CONFIG_ENCRYPTION_KEY:?INTEGRATION_CONFIG_ENCRYPTION_KEY is required}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY is required}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:?INTEGRATION_TOKEN_ENCRYPTION_KEY is required}
      # Custom REST live-case ceiling (plan 09 OD-08). Only the worker evaluates
      # it (the sync guard runs in the polling cycle); the web service never
      # reads it. Unset or invalid falls back to the same 1000 in code.
      CUSTOM_PROVIDER_LIVE_CASE_CEILING: ${CUSTOM_PROVIDER_LIVE_CASE_CEILING:-1000}
      WORKER_ACTIVE_POLL_MS: ${WORKER_ACTIVE_POLL_MS:-300000}
      WORKER_RECONCILIATION_MS: ${WORKER_RECONCILIATION_MS:-1800000}
      # All optional (roadmap step 29) — see .env.example's "Observability"
      # section and docs/deployment.md's "Health checks and observability".
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8081}
      # Watchdog election lock (roadmap step 42; it no longer serializes the
      # worker). See docs/deployment.md.
      WORKER_LOCK_RETRY_MS: ${WORKER_LOCK_RETRY_MS:-15000}
      WORKER_LOCK_PING_MS: ${WORKER_LOCK_PING_MS:-30000}
      # Organizations processed at once, per worker container.
      ORGANIZATION_CONCURRENCY: ${ORGANIZATION_CONCURRENCY:-3}
      # Multi-worker leases. A crashed worker's organizations are taken over
      # by another worker WORKER_LEASE_TTL_MS after its last renewal.
      WORKER_LEASE_TTL_MS: ${WORKER_LEASE_TTL_MS:-60000}
      WORKER_CLAIM_POLL_MS: ${WORKER_CLAIM_POLL_MS:-1000}
      WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-30000}
      # Per-worker Prisma pool. Unset = 2 x ORGANIZATION_CONCURRENCY + 4 (10 at
      # the default 3); see "Connection budget" in docs/deployment.md.
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPS_ALERT_SLACK_WEBHOOK_URL: ${OPS_ALERT_SLACK_WEBHOOK_URL:-}
      # The email channel's recipient — sent through the shared
      # DEPLOYMENT_SMTP_* config above (the web service's block), not its
      # own SMTP credentials. Stays off if DEPLOYMENT_SMTP_* is unset.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      DEPLOYMENT_SMTP_HOST: ${DEPLOYMENT_SMTP_HOST:-}
      DEPLOYMENT_SMTP_PORT: ${DEPLOYMENT_SMTP_PORT:-587}
      DEPLOYMENT_SMTP_SECURITY: ${DEPLOYMENT_SMTP_SECURITY:-starttls}
      DEPLOYMENT_SMTP_USER: ${DEPLOYMENT_SMTP_USER:-}
      DEPLOYMENT_SMTP_PASSWORD: ${DEPLOYMENT_SMTP_PASSWORD:-}
      DEPLOYMENT_SMTP_FROM: ${DEPLOYMENT_SMTP_FROM:-}
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_DIR:-/etc/elapsed/ssl}:/etc/nginx/ssl:ro
volumes:
  postgres-data:
